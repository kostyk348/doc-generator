# Nginx location block for generator-doc-gost microservice (/docgen/)
# Add to drf_catalog_service/systemd/nginx.conf inside the main server block

location ^~ /docgen/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    
    # Active Auth Protection: Basic Auth on Nginx location level
    auth_basic "TMDATA Portal - Doc Generator Access";
    auth_basic_user_file /etc/nginx/.htpasswd;
}

